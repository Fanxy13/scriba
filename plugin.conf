# Scriba – a Lotus plugin: your school folder becomes text for Claude, one file per subject, made on this Mac.
# Install: lotus plugin install https://github.com/Fanxy13/scriba · start: /scriba

name        = scriba
title       = Scriba
version     = 1.0
author      = Fanxy13
description = Dein Schulordner als Lernstoff für Claude – pro Fach eine Textdatei, mit Texterkennung und lokaler KI
homepage    = https://github.com/Fanxy13/scriba
access      = full                 # it reads your school folder and writes the text next to it

command scriba = scriba.zsh

startup       = scriba.zsh __startup    # "Scriba: 3 Dateien neu in Mathematik" – only when something is new
startup.every = 900
